[project]
name = "xai-proxy"
version = "1.0.0"
description = "Fully transparent reverse proxy to xAI API (https://api.x.ai)"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27.0",
    "starlette>=0.38.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
